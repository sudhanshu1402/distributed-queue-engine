<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-label="distributed-queue-engine at a glance: Redis and BullMQ, the failure is a slow SMTP call blocking the request, the fix is a 202 and a worker, proof is 10 passing tests with no live Redis">
  <rect width="880" height="150" rx="10" fill="#0d1117" stroke="#30363d"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="20" y="30" width="195" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="36" y="56" fill="#7d8590" font-size="11" letter-spacing="1">QUEUE</text>
    <text x="36" y="82" fill="#e6edf3" font-size="16" font-weight="600">Redis+BullMQ</text>
    <text x="36" y="106" fill="#7d8590" font-size="12">priority + retries</text>
    <rect x="235" y="30" width="195" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="251" y="56" fill="#7d8590" font-size="11" letter-spacing="1">FAILURE</text>
    <text x="251" y="82" fill="#e6edf3" font-size="16" font-weight="600">slow SMTP</text>
    <text x="251" y="106" fill="#7d8590" font-size="12">blocks the request path</text>
    <rect x="450" y="30" width="195" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="466" y="56" fill="#7d8590" font-size="11" letter-spacing="1">FIX</text>
    <text x="466" y="82" fill="#e6edf3" font-size="16" font-weight="600">202 async</text>
    <text x="466" y="106" fill="#7d8590" font-size="12">workers do the wait</text>
    <rect x="665" y="30" width="195" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="681" y="56" fill="#7d8590" font-size="11" letter-spacing="1">PROOF</text>
    <text x="681" y="82" fill="#e6edf3" font-size="16" font-weight="600">10 passing</text>
    <text x="681" y="106" fill="#7d8590" font-size="12">no live Redis needed</text>
  </g>
</svg>
