<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="distributed-queue-engine as a metro map: API returns 202 at once, the job waits in Redis on {emails}:outbound, workers send it to SMTP off the request path, retrying at 5 s then 10 s, and after 3 attempts it lands in the failed set. Priority 1 password resets drain before priority 10." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.mo{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}.sa{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}.se{font-family:Georgia,"Times New Roman",serif}.bl{font-family:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif}
.in{opacity:0;animation:in .5s ease-out forwards}@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.dr{stroke-dasharray:1600;stroke-dashoffset:1600;animation:dr 2.2s ease-in-out forwards}@keyframes dr{to{stroke-dashoffset:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style>
<rect width="1200" height="500" fill="#fff"/>
<text x="48" y="70" class="sa" font-size="40" font-weight="700" fill="#111">distributed-queue-engine</text>
<text x="48" y="100" class="sa" font-size="16" fill="#555">Background jobs on Redis and BullMQ. The slow part leaves the request path.</text>
<g fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
<path class="dr" d="M80 280H330L400 210H640L710 280H1100" stroke="#e4322b"/>
<path class="dr" d="M400 210L470 350H700L760 280" stroke="#0a7bd8" style="animation-delay:0.5s"/>
<path class="dr" d="M870 280L930 380H1000" stroke="#8c8c8c" stroke-dasharray="2 18" style="animation-delay:1s"/></g>
<path d="M870 262C870 205 1100 205 1100 262" fill="none" stroke="#f0a500" stroke-width="5" stroke-dasharray="6 8"/>
<text x="985" y="200" text-anchor="middle" class="mo" font-size="12" fill="#b07800">retry: 5 s, then 10 s</text>
<g class="sa" font-size="15" fill="#111"><circle cx="80" cy="280" r="14" fill="#fff" stroke="#111" stroke-width="5"/><text x="80" y="320" text-anchor="middle" font-weight="700">API</text><text x="80" y="338" text-anchor="middle" font-size="12" fill="#666">POST /reset-password</text><circle cx="330" cy="280" r="14" fill="#fff" stroke="#111" stroke-width="5"/><text x="330" y="320" text-anchor="middle" font-weight="700">202</text><text x="330" y="338" text-anchor="middle" font-size="12" fill="#666">returned at once</text><circle cx="520" cy="210" r="14" fill="#fff" stroke="#111" stroke-width="5"/><text x="520" y="156" text-anchor="middle" font-weight="700">Redis</text><text x="520" y="174" text-anchor="middle" font-size="12" fill="#666">{emails}:outbound</text><circle cx="870" cy="280" r="14" fill="#fff" stroke="#111" stroke-width="5"/><text x="870" y="320" text-anchor="middle" font-weight="700">workers</text><text x="870" y="338" text-anchor="middle" font-size="12" fill="#666">scale on their own</text><circle cx="1100" cy="280" r="14" fill="#fff" stroke="#111" stroke-width="5"/><text x="1100" y="320" text-anchor="end" font-weight="700">SMTP</text><text x="1100" y="338" text-anchor="end" font-size="12" fill="#666">1.5 s, off the request</text><circle cx="1000" cy="380" r="14" fill="#fff" stroke="#111" stroke-width="5"/><text x="1024" y="386" text-anchor="start" font-weight="700">failed set</text><text x="1024" y="404" text-anchor="start" font-size="12" fill="#666">after 3 attempts</text></g>
<g class="sa" font-size="13" fill="#444"><rect x="48" y="444" width="26" height="9" fill="#e4322b"/><text x="82" y="453">priority 1: password reset</text>
<rect x="300" y="444" width="26" height="9" fill="#0a7bd8"/><text x="334" y="453">priority 10: everything else</text>
<rect x="560" y="444" width="26" height="9" fill="#8c8c8c"/><text x="594" y="453">dead letters</text><text x="1150" y="453" text-anchor="end">reference implementation · simulated worker I/O</text></g></svg>